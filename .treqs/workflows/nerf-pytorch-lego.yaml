name: nerf-pytorch-lego reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag.
#
# Row-specific additions on top of the generated file, all in the untraced setup
# stage, each explained at its own line below:
#   (a) the provenance CLI is installed by NAME AND VERSION from a public index
#       and verified by wheel sha256, not fetched from a presigned URL;
#   (b) this repository's own `requirements.txt` is installed -- minus its torch
#       pin, see below -- because a bare clone has none of it;
#   (c) three pre-flight gates run before anything is paid for: upstream files
#       unmodified, environment recordable as a portable freeze, and the native
#       (non-pip) library boundary reported.
#
# WHY THERE IS NO EXPERIMENT-TRACKER FLAG ANYWHERE IN THIS FILE.
# This repository ships no experiment logging. `grep -ri wandb|mlflow|comet|
# neptune` over the whole tree returns nothing. `tensorboard>=2.0` is listed in
# requirements.txt, but the only line that would use it,
#     # writer = SummaryWriter(os.path.join(basedir, 'summaries', expname))
# is commented out (run_nerf.py:708), and every `tf.contrib.summary` call in
# train() sits inside a triple-quoted block (run_nerf.py:830-870) -- so the
# dependency is declared and never imported. The training metric (PSNR) is
# computed every `--i_print` iterations and written to stdout by `tqdm.write`
# (run_nerf.py:829) and nowhere else.
#
# So `roar run --wandb-to-trackio` and `TRACKIO_SPACE_ID` are deliberately ABSENT
# from the three run stages below. The bridge only forwards metrics a workload
# actually emits through `wandb`; against a workload that never imports wandb it
# is a no-op that would leave the record implying a logging path that does not
# exist. Adding `wandb.init()` to run_nerf.py would forfeit the one property that
# makes this row worth reading -- that upstream's training script is byte-
# identical to the published one -- so it is not done. The row publishes
# `experimentUrl: null` with that reason stated.

secrets:
  - HF_TOKEN            # roar put upload (the example data is fetched anonymously)

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -c "import sys; print('python', sys.version)"
    python -m pip install --quiet requests || true
    rm -rf *.egg-info src/*.egg-info
    # ---- self-terminating watchdog, sized from a measurement --------------
    # A previous capture of this exact workflow on this exact instance type ran
    # 18m07s wall from job creation to job completion -- 31.6s fetch, 684.1s
    # train (2000 iterations at 3.28 it/s), 22.4s render, the rest provisioning,
    # setup and publish. Expectation for this run is therefore ~20 minutes, and
    # the watchdog is set at 2x that. It is a backstop against an operator or a
    # job runner that dies holding a live GPU, not a step timeout: if the run
    # finishes normally the host is torn down long before this fires.
    sudo shutdown -h +40 || true
    echo "watchdog: halt scheduled at +40 min (2x the 20-min measured expectation)"
    # ---- make the fork URL explicit on `origin` before anything is recorded --
    # Reproducing this row means cloning the remote recorded in its lineage, so
    # the recorded value has to be a URL a stranger can actually fetch.
    #
    # It is worth knowing WHY this is set rather than assumed. A `[remote
    # "origin"]` section can exist in .git/config with its `url =` line absent --
    # any checkout whose config was rewritten line-wise (for instance to strip an
    # embedded credential) ends up in that state. In it, `git remote` still lists
    # `origin`, and `git remote get-url origin` does NOT fail: it prints the
    # remote's NAME back and exits 0. Anything that records "whatever get-url
    # printed" therefore records the literal string `origin` as the repository
    # URL, with no error anywhere, and the resulting record cannot be cloned.
    #
    # Setting the URL explicitly here, in the untraced setup stage and before any
    # traced step, makes the recorded remote correct by construction.
    git remote set-url origin https://github.com/reproducible-ai/nerf-pytorch.git \
      || git remote add origin https://github.com/reproducible-ai/nerf-pytorch.git
    git remote -v
    test "$(git remote get-url origin)" = "https://github.com/reproducible-ai/nerf-pytorch.git" \
      || { echo "origin is not the fork URL: $(git remote get-url origin)"; exit 1; }
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    # `uv` is not on PATH on every campaign AMI (this stage runs as root and
    # /root/.local/bin is not always inherited), so make it explicit and
    # bootstrap it if the image lacks it. This stage is `trace: off`.
    export PATH=$PATH:/root/.local/bin:/usr/local/bin
    command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh; }
    command -v uv
    RECORDED_PY="$(python -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')"
    echo "recorded interpreter: $RECORDED_PY"
    uv tool install --python "$RECORDED_PY" --force --with huggingface-hub \
        --index-strategy unsafe-best-match \
        --index-url https://test.pypi.org/simple/ \
        --extra-index-url https://pypi.org/simple/ \
        roar-cli==0.4.4rc6
    sudo ln -sf "$(uv tool dir --bin 2>/dev/null || echo /root/.local/bin)/roar" /usr/local/bin/roar
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc6" || \
      { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    # A version string is not an identity: distinct builds have shipped under one
    # version string on this project before. Pin the artefact by wheel sha256 and
    # prove the installed files came from that wheel.
    ROAR_WHEEL_SCRATCH=/var/tmp python repro/verify_roar_wheel.py \
      --version 0.4.4rc6 \
      --sha256 c7115b748886259b6a089e547404376acf84c3b81b4cbc8dc5610490ebea7199 \
      --exe "$(command -v roar)"
    test "$(ls /usr/local/bin/../lib/python3.10/dist-packages/roar/bin 2>/dev/null | wc -l)" != "0" || \
      test "$(ls $(dirname $(readlink -f $(command -v roar)))/../lib/python*/site-packages/roar/bin | wc -l)" -ge 6 || \
      { echo "NO TRACER BINARIES"; exit 1; }
    roar --version
    roar tracer use preload
    roar tracer
    # ---- (b) this repository's own dependency set ---------------------------
    # requirements.txt is installed EXCEPT for its first two lines:
    #     torch==1.11.0
    #     torchvision>=0.9.1
    # `torch==1.11.0` is from March 2022. It publishes no wheel for this image's
    # Python and no build for a modern CUDA runtime, and installing it would
    # replace the image's working GPU torch with something that cannot address
    # this GPU. The image's own torch is used instead and is what gets recorded,
    # so the rebuild installs the version this run actually used rather than a
    # pin that has not been installable for years. This is a real divergence from
    # upstream's published requirements and it is stated in the row notes rather
    # than hidden here. Nothing else in the file is altered: imageio,
    # imageio-ffmpeg, matplotlib, configargparse, tqdm and opencv-python are
    # installed exactly as listed. torchvision is skipped because it is not
    # imported anywhere in this repository (`grep -r torchvision` finds only the
    # requirements line), so installing it would put a package in the environment
    # that the workload never loads.
    grep -v -E '^(torch==|torchvision)' requirements.txt > /tmp/requirements.norch.txt
    echo "--- installing (requirements.txt minus the torch pins) ---"
    cat /tmp/requirements.norch.txt
    # `tensorboard>=2.0` is in this list and is never imported by any file in the
    # repository (the only SummaryWriter line is commented out). It is installed
    # anyway, because installing what upstream declares is the point. If its
    # resolver constraints collide with the image's, fall back to the set the
    # workload actually loads and SAY SO rather than failing the row over a
    # dependency no traced step touches.
    python -m pip install --quiet -r /tmp/requirements.norch.txt || {
      echo "=== requirements.txt did not resolve on this image; retrying without tensorboard ==="
      grep -v -E '^(torch==|torchvision|tensorboard)' requirements.txt > /tmp/requirements.min.txt
      cat /tmp/requirements.min.txt
      python -m pip install -r /tmp/requirements.min.txt
    }
    python -c "import torch; print('torch', torch.__version__, '| cuda', torch.cuda.is_available(), '|', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'cpu')"
    # ---- (c) pre-flight gates, before anything is paid for -------------------
    # The reproduction claim is "upstream's code, unmodified". Prove it by blob
    # hash rather than asserting it in prose. .gitignore is the one declared
    # exemption and its full diff is printed by the script.
    python repro/assert_upstream_unmodified.py --allow-modified .gitignore
    # A `+cuNNN` local version or a PEP-503 duplicate makes the recorded freeze
    # un-installable from PyPI, so the lineage could never be rebuilt. Fail here
    # rather than at verification, after paying for the GPU.
    python repro/freeze_audit.py
    # requirements.txt lists opencv-python and imageio-ffmpeg. One of those two
    # is pip-closed and the other is not, and the freeze cannot tell you which.
    # This prints the boundary into the run's own log. Diagnostic, never fatal.
    python repro/native_deps_probe.py || true
    # ...and then make the consequence non-silent. `run_nerf.py` imports
    # load_blender.py and load_LINEMOD.py at module scope and both do a bare
    # `import cv2`, so a missing system OpenGL/glib stack kills the TRAIN step at
    # import, minutes into a paid run. If cv2 will not load, install the OS
    # packages it needs HERE, in the open, and say exactly which -- a pip freeze
    # cannot express them, so a rebuild on a bare image needs to be told.
    python -c "import cv2; print('cv2', cv2.__version__, 'imports cleanly; no OS-package gap on this image')" || {
      echo "=== cv2 FAILED TO IMPORT: installing the OS packages pip cannot record ==="
      echo "=== apt-get install -y libgl1 libglx0 libglvnd0 libglib2.0-0t64 ==="
      sudo apt-get update -qq
      sudo apt-get install -y libgl1 libglx0 libglvnd0 libglib2.0-0t64 \
        || sudo apt-get install -y libgl1 libglx0 libglvnd0 libglib2.0-0 \
        || sudo apt-get install -y libgl1-mesa-glx libglib2.0-0
      echo "=== installed; re-checking ==="
      python -c "import cv2; print('cv2', cv2.__version__, 'imports after the OS-package install')"
      python repro/native_deps_probe.py || true
    }
    # imageio's mp4 writer (used by the render step) shells out to the ffmpeg
    # imageio-ffmpeg bundles. Prove it resolves before the render step needs it.
    python -c "import imageio_ffmpeg; print('bundled ffmpeg:', imageio_ffmpeg.get_ffmpeg_exe())"
    # The publish stage uploads with this token; without it `roar put` fails
    # after every traced step has already succeeded. Value never printed.
    python -c "import os,sys; t=os.environ.get('HF_TOKEN') or ''; print('HF_TOKEN present in task env:', bool(t), '| length:', len(t)); sys.exit(0 if t else 1)"
    git status --porcelain
    roar init || true
  trace: off

# Upstream's `download_example_data.sh` as a traced, sha256-pinned step. The URL
# is upstream's own; the archive holds exactly the two scenes README.md's quick
# start uses (nerf_synthetic/lego and nerf_llff_data/fern). Making this its own
# step is what turns the dataset into a provenance EDGE -- the train step's reads
# of data/nerf_synthetic/lego/** then resolve to files this step wrote, instead
# of appearing as inputs from nowhere.
fetch_data:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n fetch_data -- python repro/fetch_example_data.py --out-dir data
  trace: off

# TRUNCATED: 2000 of the 200000 iterations upstream hardcodes at run_nerf.py:701.
# `--train-iters` is inside the recorded argv, so the lineage states the
# truncation on its face and a reader who wants the full run raises one number.
# `--i_weights 2000` is upstream's own checkpoint-interval flag: its default is
# 10000, which is larger than this run, so without it the run would finish having
# written no checkpoint at all and there would be no artefact to publish.
# Everything else comes from upstream's own configs/lego.txt.
train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n train -- python repro/train_truncated.py --train-iters 2000 --config configs/lego.txt --i_weights 2000
  trace: off

# Upstream's own entry point and upstream's own flags, no wrapper: --render_only
# short-circuits before the training loop, so there is nothing to truncate. It
# reloads the checkpoint the train step wrote (the second provenance edge),
# renders the 25 held-out test poses and writes them plus an mp4 via
# imageio-ffmpeg. --render_factor 8 renders at 50x50 instead of 400x400: this
# step exists to exercise the reload + render + video-encode path end to end,
# not to produce a presentable video from a 1%-trained model.
render_novel_views:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n render_novel_views -- python run_nerf.py --config configs/lego.txt --render_only --render_test --render_factor 8
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact logs/blender_paper_lego/002000.tar model.name=nerf-pytorch-lego model.version=1 license.id=MIT license.name='MIT License' description='NeRF (Neural Radiance Fields): coarse+fine 8-layer 256-wide MLPs with positional encoding and view-dependent radiance, fit to the lego scene of the NeRF synthetic dataset at 400x400 (half_res). TRUNCATED pipeline-viability run: 2000 of upstream'"'"'s hardcoded 200000 iterations, NOT converged.' documentation.url=https://github.com/yenchenlin/nerf-pytorch/blob/master/README.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put logs/blender_paper_lego/002000.tar hf://reproducible-ai/nerf-pytorch-lego --public --yes --no-tag -m "NeRF fit to the lego scene of the NeRF synthetic dataset (400x400, half_res), 2000 of upstream's hardcoded 200000 iterations. TRUNCATED pipeline-viability run: NOT converged and not a quality result."
  trace: off
